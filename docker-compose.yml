services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    volumes:
      - ${DOCUMENT_HOST_PATH:-./data/documents}:/data/documents
      - .:/repo:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${DOCUMENT_HOST_PATH:-./data/documents}:/data/documents
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
